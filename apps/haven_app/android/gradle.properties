org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental caches hold every source path relative to the project
# directory, and this project is on D: while the pub cache is on C:. Across two
# drives `relativeTo` throws and the compile fails while closing its maps, so the
# incremental machinery is turned off here rather than left to fail on every build.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
