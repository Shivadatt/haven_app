name: haven_api
description: "Haven: Supabase and Firebase clients, RPC contracts, realtime streams."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  get: ^4.7.3
  haven_core:
    path: ../haven_core
  haven_models:
    path: ../haven_models
  haven_offline:
    path: ../haven_offline
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
